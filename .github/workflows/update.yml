name: Update news

# Runs the whole pipeline (collect -> group -> summarise) on GitHub's servers,
# so it keeps working when your own PC is off.
# Note: GitHub may start scheduled runs several minutes late, and skips them
# in repositories with no activity for 60 days.

on:
  schedule:
    - cron: "17 */4 * * *"      # every 4 hours, at minute 17
  workflow_dispatch:             # also lets you run it by hand from the Actions tab

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the news update
        run: python manage.py update_news
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # optional, e.g. gemini-3.5-flash:18:5,gemini-3.1-flash-lite:480:15
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
